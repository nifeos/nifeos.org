# The crates the site renders a page for, each at one commit of its own repository.
#
# One table per crate, named for the crate. `repository` is the GitHub repository and `commit` a
# full 40-hex commit of it; script/site refuses a branch name or a short hash (lib/crates.cjs). The
# build fetches each repository shallow at its commit and renders its README.md at
# /crates/<crate>/. A crate is listed once it has its own public repository. A pin bump is an
# ordinary pull request.

